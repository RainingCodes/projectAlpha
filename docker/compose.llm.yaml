services:
  vllm:
    image: vllm/vllm-openai:v0.6.6.post1
    container_name: vllm
    hostname: vllm
    networks: [robot_dds]
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-}
    command:
      - --model
      - LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
      - --dtype
      - half
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    networks: [robot_dds]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  stonefish:
    image: projectalpha:jazzy-integrated
    container_name: stonefish
    hostname: stonefish
    networks: [robot_dds]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      XDG_RUNTIME_DIR: /tmp/xdg-stonefish
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./stonefish-llm-stack.sh:/stonefish-llm-stack.sh:ro
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["/bin/bash", "/stonefish-llm-stack.sh"]

  llm-control:
    build:
      context: ./llm-control
      dockerfile: Dockerfile
    image: projectalpha:llm-control
    container_name: llm-control
    hostname: llm-control
    networks: [robot_dds]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - llm-settings.env
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - stonefish
      - vllm
      # - ollama   # HF/vLLM 쓸 때는 굳이 필요 없음

networks:
  robot_dds:
    driver: bridge

volumes:
  ollama_data:
  hf_cache: